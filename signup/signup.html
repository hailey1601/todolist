<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signup - OwlHelper</title>
    <link rel="stylesheet" href="signup.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
    />
  </head>
  <body>
    <header>
      <div class="header">
        <div class="logo">OwlHelper</div>
        <nav>
          <ul class="nav">
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Contact</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <div class="wrapper">
      <div class="image">
        <img
          src="../image/undraw_to-do-list_eoia.svg"
          alt="Signup illustration"
        />
      </div>

      <div class="container">
        <div class="login-box">
          <h2>Agent Signup</h2>
          <p>Welcome! Fill in the details to create your account</p>
          <form id="register-form">
            <input  class='username' type="text" placeholder="Full Name" required />
            <input class='email-phone' type="text" placeholder="Email / Phone No" required />
            <input class='password' type="password" placeholder="Create Passcode" required />
            <input class='confirm-pass' type="password" placeholder="Confirm Passcode" required />
            <button class="submit" type="submit">Sign up</button>
            <div class="divider">— Or Sign up with —</div>
            <div class="social-login">
              <button class="google">
                <i class="bi bi-google"></i> Google
              </button>
              <button class="facebook">
                <i class="bi bi-facebook"></i> Facebook
              </button>
            </div>
            <p class="signup">
              Already have an account? <a href="../login/login.html">Log in</a>
            </p>
          </form>
        </div>
      </div>

      <div class="image2">
        <img
          src="../image/undraw_personal-information_h7kf (1).svg"
          alt="Signup image"
        />
      </div>
    </div>

    <script src="signup.js"></script>
  </body>
</html>
