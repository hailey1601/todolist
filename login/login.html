<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - OwlHelper</title>
    <link rel="stylesheet" href="login.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
    />
  </head>
  <body>
    <header>
      <div class="header">
        <div class="logo">OwlHelper</div>
        <nav>
          <ul class="nav">
            <li><a href="../home/home.html">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Contact</a></li>
          </ul>
        </nav>
      </div>
    </header>
    <div class="wrapper">
      <div class="image">
        <img src="../image/undraw_to-do-list_eoia.svg" alt="Login image" />
      </div>
      <div class="container">
        <div class="login-box">
          <h2>Agent Login</h2>
          <p>Hey, enter your details to get sign in to your account</p>
          <form>
            <input class='username' type="text" placeholder="Enter Email / Phone No" required />
            <input class='password' type="password" placeholder="Passcode" required />
            <a href="#" class="forgot">Having trouble in log in?</a>
            <button class='submit' type="submit">Log in</button>
            <div class="divider">— Or Log in with —</div>
            <div class="social-login">
              <button class="google"><i class="bi bi-google"></i>Google</button>
              <button class="facebook">
                <i class="bi bi-facebook"></i>Facebook
              </button>
            </div>
            <p class="signup">
              Don't have an account?
              <a href="../signup/signup.html">Request Now</a>
            </p>
          </form>
        </div>
      </div>
      <div class="image2">
        <img
          src="../image/undraw_personal-information_h7kf (1).svg"
          alt="Login image"
        />
      </div>
    </div>

    <script src="login.js"></script>
  </body>
</html>
