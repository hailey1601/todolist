<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owl To-do List Website</title>
    <link rel="stylesheet" href="home.css">
    <link href='https://cdn.boxicons.com/fonts/basic/boxicons.min.css' rel='stylesheet'>
    <script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.152.2/examples/js/loaders/GLTFLoader.js"></script>
<body>
    <header>
        <nav>
            <div class="left">
              <div class="pageName">Owlhelper</div>
            </div>
            <div class="right">
              <i class='bxr  bx-user'></i> 
            </div>
          </nav>
    </header>
    <div class="main">
        <div class="center-quote">
          <div class="title">
            <h1>To-do List</h1>
            <p>We're not just checking boxes; we're burying them.</p>
          </div>
        </div>
        <div class="button">
            <button class="login-button">Login</button>
            <button class="signup-button">Sign Up</button>
        </div>
    </div>

    <script src="home.js"></script>
    <canvas id="owl-canvas" style="position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none;"></canvas>
</body>
</html>
